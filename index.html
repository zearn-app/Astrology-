<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Astro Reveal ✨</title>  
  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">  
  
<style>  
body {  
  margin: 0;  
  font-family: 'Poppins', sans-serif;  
  background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);  
  color: white;  
  display: flex;  
  justify-content: center;  
  align-items: center;  
  height: 100vh;  
  overflow: hidden;  
}  
  
.container {  
  width: 90%;  
  max-width: 400px;  
  text-align: center;  
}  
  
.card {  
  background: rgba(255,255,255,0.05);  
  padding: 25px;  
  border-radius: 20px;  
  backdrop-filter: blur(10px);  
  box-shadow: 0 0 20px rgba(255,255,255,0.1);  
  animation: fadeIn 0.6s ease;  
}  
  
input {  
  width: 100%;  
  padding: 12px;  
  margin-top: 15px;  
  border-radius: 10px;  
  border: none;  
  outline: none;  
}  
  
button {  
  margin-top: 20px;  
  padding: 12px 20px;  
  border: none;  
  border-radius: 20px;  
  background: linear-gradient(45deg, #ff6ec4, #7873f5);  
  color: white;  
  cursor: pointer;  
  font-weight: bold;  
}  
  
button:hover {  
  opacity: 0.8;  
}  
  
@keyframes fadeIn {  
  from { opacity: 0; transform: translateY(20px); }  
  to { opacity: 1; transform: translateY(0); }  
}  
  
.result {  
  font-size: 14px;  
  line-height: 1.6;  
}  

.loader {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.8;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% {opacity: 0.3;}
  50% {opacity: 1;}
  100% {opacity: 0.3;}
}
</style>  
</head>  
  
<body>  
  
<div class="container">  
  <div class="card" id="card">  
    <h2 id="question">Enter your name</h2>  
    <input id="input" placeholder="Type here...">  
    <button onclick="next()">Next ✨</button>  
  </div>  
</div>  
  
<script>  
let step = 0;  
let answers = [];  
  
const questions = [  
  "Enter your name",  
  "Your age",  
  "Your place",  
  "Your lucky number",  
  "A name you hate",  
  "A name you love",  
  "Your future plan",  
  "Your biggest fear",  
  "Your dream",  
  "Someone you trust the most"  
];  

const zodiacSigns = ["Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋", "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏", "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"];

const predictions = [
  "A powerful opportunity is approaching you.",
  "Someone from your past will re-enter your life.",
  "You will soon face a decision that changes everything.",
  "A hidden talent inside you will rise soon.",
  "Unexpected happiness is closer than you think."
];

function next() {  
  const input = document.getElementById("input");  

  if(input.value.trim() === "") return;

  answers.push(input.value);  
  input.value = "";  
  step++;  
  
  if (step < questions.length) {  
    document.getElementById("question").innerText = questions[step];  
  } else {  
    loadingScreen();  
  }  
}  

function loadingScreen(){
  document.getElementById("card").innerHTML = `
    <h2>🔮 Reading Your Stars...</h2>
    <div class="loader">Analyzing cosmic energy...</div>
  `;

  setTimeout(showResult, 3000);
}

function showResult() {  
  const name = answers[0];  
  const age = parseInt(answers[1]);  
  const place = answers[2];  
  const lucky = answers[3];  
  const loveName = answers[5];  
  const future = answers[6];  
  const fear = answers[7];  
  const dream = answers[8];  
  const trust = answers[9];  

  const zodiac = zodiacSigns[age % 12];
  const randomPrediction = predictions[Math.floor(Math.random()*predictions.length)];

  document.getElementById("card").innerHTML = `  
    <h2>✨ Astrology Reading ✨</h2>  
    <p class="result" id="typing"></p>
  `;  

  const text = `
Dear ${name}, from ${place} 🌌...

Your aura aligns with <b>${zodiac}</b>, a sign of strong emotional depth and hidden power.

Your lucky number <b>${lucky}</b> is not random... it connects to your life path.

The person you love, <b>${loveName}</b>, has a deeper connection with your destiny than you realize...

Your dream "<b>${dream}</b>" is already written in your stars. 🌠

But your fear "<b>${fear}</b>" is the only thing holding you back.

${randomPrediction}

Someone you trust, <b>${trust}</b>, will soon play a crucial role in your journey.

Within 3–6 months, your future plan "<b>${future}</b>" will begin to take shape...

✨ Trust the universe. Your time is coming.
`;

  typeEffect(text);
}

function typeEffect(text){
  let i = 0;
  const speed = 30;
  const typing = document.getElementById("typing");

  function type(){
    if(i < text.length){
      typing.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}
</script>  
  
</body>  
  </html>
