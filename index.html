<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Reveal ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

/* Stars Background */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background: transparent;
}

.stars::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow: 
    50px 100px white, 150px 200px white, 300px 50px white,
    500px 300px white, 700px 150px white, 900px 400px white;
  animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* Container */
.container {
  text-align: center;
  z-index: 2;
}

/* Title */
h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  background: linear-gradient(45deg, #ffccff, #66ccff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Subtitle */
p {
  font-size: 1.2rem;
  margin-bottom: 30px;
  color: #ccc;
}

/* Button */
button {
  padding: 15px 40px;
  font-size: 1.2rem;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff4ecd, #7b5cff);
  color: white;
  transition: 0.3s;
  box-shadow: 0 0 20px rgba(255, 78, 205, 0.6);
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(123, 92, 255, 0.8);
}

/* Glow animation */
@keyframes glow {
  0% { box-shadow: 0 0 10px #ff4ecd; }
  100% { box-shadow: 0 0 25px #7b5cff; }
}

button {
  animation: glow 1.5s infinite alternate;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <h1>Astro Reveal ✨</h1>
  <p>Discover your hidden destiny 🔮</p>
  <button onclick="goToMain()">Enter</button>
</div>

<script>
function goToMain() {
  window.location.href = "main.html";
}
</script>

</body>
</html>
