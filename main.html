<!DOCTYPE html>    
<html lang="en">    
<head>    
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">    
<title>Astro Reveal ✨</title>    

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">    

<style>    
body {    
  margin: 0;    
  font-family: 'Poppins', sans-serif;    
  background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);    
  color: white;    
  display: flex;    
  justify-content: center;    
  align-items: center;    
  height: 100vh;    
  overflow: hidden;    
}    

.container {    
  width: 90%;    
  max-width: 400px;    
  text-align: center;    
}    

.card {    
  background: rgba(255,255,255,0.05);    
  padding: 25px;    
  border-radius: 20px;    
  backdrop-filter: blur(10px);    
  box-shadow: 0 0 20px rgba(255,255,255,0.1);    
  animation: fadeIn 0.6s ease;    
}    

input {    
  width: 100%;    
  padding: 12px;    
  margin-top: 15px;    
  border-radius: 10px;    
  border: none;    
  outline: none;    
}    

button {    
  margin-top: 20px;    
  padding: 12px 20px;    
  border: none;    
  border-radius: 20px;    
  background: linear-gradient(45deg, #ff6ec4, #7873f5);    
  color: white;    
  cursor: pointer;    
  font-weight: bold;    
}    

button:hover {    
  opacity: 0.8;    
}    

@keyframes fadeIn {    
  from { opacity: 0; transform: translateY(20px); }    
  to { opacity: 1; transform: translateY(0); }    
}    

.loader {  
  margin-top: 20px;  
  font-size: 14px;  
  opacity: 0.8;  
  animation: pulse 1.5s infinite;  
}  

@keyframes pulse {  
  0% {opacity: 0.3;}  
  50% {opacity: 1;}  
  100% {opacity: 0.3;}  
}  

/* 🆕 RESULT UI */
.result-card {
  background: rgba(255,255,255,0.07);
  margin-top: 15px;
  padding: 15px;
  border-radius: 15px;
  text-align: left;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s forwards;
}

.result-card h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.icon {
  margin-right: 6px;
}

.positive { color: #00ffcc; }
.warning { color: #ffcc00; }
.future { color: #66a3ff; }
.love { color: #ff6ec4; }
.danger { color: #ff4d6d; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>    
</head>    

<body>    

<div class="container">    
  <div class="card" id="card">    
    <h2 id="question">Enter your name</h2>    
    <input id="input" placeholder="Type here...">    
    <button onclick="next()">Next ✨</button>    
  </div>    
</div>    

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>  
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>  

<script>  

const firebaseConfig = {      
  apiKey: "YOUR_KEY",      
  authDomain: "YOUR_DOMAIN",      
  projectId: "YOUR_ID",      
};      

firebase.initializeApp(firebaseConfig);      
const db = firebase.firestore();      

let step = 0;        
let answers = [];        

const questions = [        
  "Enter your name",        
  "Your age",        
  "Your place",        
  "Your lucky number",        
  "A name you hate",        
  "A name you love",        
  "Your future plan",        
  "Your biggest fear",        
  "Your dream",        
  "Someone you trust the most"        
];        

function next() {        
  const input = document.getElementById("input");        
  if(input.value.trim() === "") return;      

  answers.push(input.value);        
  input.value = "";        
  step++;        

  if (step < questions.length) {        
    document.getElementById("question").innerText = questions[step];        
  } else {        
    loadingScreen();        
  }        
}        

function loadingScreen(){      
  document.getElementById("card").innerHTML = `      
    <h2>🔮 Reading Your Stars...</h2>      
    <div class="loader">Analyzing cosmic energy...</div>      
  `;      
  setTimeout(showResult, 3000);      
}      

function letterValue(name){  
  return name.trim().toLowerCase().charCodeAt(0) - 96;  
}  

function calculateMarriageLetter(name, loveName, hateName){
  let total = name.length + loveName.length;
  if(total > 26) total -= hateName.length;
  while(total > 26) total -= 26;
  return String.fromCharCode(96 + total);
}

function generateAstroResult(){  
  const name = answers[0];  
  const hateName = answers[4];  
  const loveName = answers[5];  

  const mainVal = letterValue(name);  
  const hateVal = letterValue(hateName);  
  const loveVal = letterValue(loveName);  

  return {  
    futureOutcome: (hateVal % 2 === 0) ? "moving in a stable direction" : "facing hidden challenges",  
    successOutcome: (loveVal % 2 === 0) ? "aligned with success" : "requiring more effort",  
    lifePhase: (mainVal % 2 === 0) ? "positive" : "challenging",  
    timePeriod: Math.floor(Math.random()*12+1) + " months",
    marriageLetter: calculateMarriageLetter(name, loveName, hateName)
  };  
}  

function showResult() {        
  const name = answers[0];        
  const r = generateAstroResult();  

  document.getElementById("card").innerHTML = `        
    <h2>✨ Astrology Reading ✨</h2>        

    <div class="result-card positive" style="animation-delay:0.2s">
      <h3>🌟 POSITIVE</h3>
      You are in a <b>${r.lifePhase}</b> phase. Your path is <b>${r.successOutcome}</b>.
    </div>

    <div class="result-card warning" style="animation-delay:0.6s">
      <h3>⚠️ NEGATIVES</h3>
      Your journey may be <b>${r.futureOutcome}</b>.
    </div>

    <div class="result-card future" style="animation-delay:1s">
      <h3>🔮 FUTURE</h3>
      This phase lasts <b>${r.timePeriod}</b>. Changes are coming soon.
    </div>

    <div class="result-card love" style="animation-delay:1.4s">
      <h3>💍 MARRIAGE</h3>
      A strong connection with letter <b>${r.marriageLetter.toUpperCase()}</b>.
    </div>

    <div class="result-card danger" style="animation-delay:1.8s">
      <h3>🔥 ENEMY</h3>
      Be careful whom you trust. Not everyone supports you.
    </div>
  `;        

  saveToFirebase(r);  
}  

function saveToFirebase(result){      
  db.collection("astro_users").add({      
    name: answers[0],      
    createdAt: new Date()      
  });      
}  

</script>  

</body>    
</html>
