<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Reveal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Poppins;
  background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  width: 90%;
  max-width: 400px;
  background: rgba(255,255,255,0.05);
  padding: 25px;
  border-radius: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  border: none;
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #ff6ec4, #7873f5);
  color: white;
}

.result-card {
  background: rgba(255,255,255,0.07);
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2 id="question">What do people usually call you?</h2>
  <input id="input" placeholder="Type here...">
  <button onclick="next()">Next ✨</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbYt_z5GaqOTcVlz3FRjssTwC7Uzv_MdA",
  authDomain: "information-b9593.firebaseapp.com",
  projectId: "information-b9593",
  storageBucket: "information-b9593.firebasestorage.app",
  messagingSenderId: "767588407430",
  appId: "1:767588407430:web:006bb7ff0b7c66b751d907"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let step = 0;
let answers = [];

const questions = [
  "What do people usually call you?",
  "How old are you right now?",
  "Where are you from?",
  "Pick a number that feels lucky to you 🍀",
  "A name you don’t like hearing",
  "A name that makes you happy 😊",
  "What do you want to do in your future?",
  "What are you most afraid of?",
  "What is your biggest dream?",
  "Who do you trust the most?"
];

window.next = function(){
  const input = document.getElementById("input");

  if(input.value.trim() === "") return;

  answers.push(input.value);
  input.value = "";
  step++;

  if(step < questions.length){
    document.getElementById("question").innerText = questions[step];
  } else {
    document.getElementById("card").innerHTML = "<h2>Reading your destiny...</h2>";
  }
};

</script>

</body>
</html>
